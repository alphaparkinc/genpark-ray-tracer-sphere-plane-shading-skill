[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-ray-tracer-sphere-plane-shading-skill"
version = "1.0.0"
description = "3D Whitted-style ray tracer with sphere/plane geometric intersection and Phong reflection shading."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AlphaPark Team", email = "engineering@alphapark.ai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: 3D Rendering"
]

[project.urls]
Homepage = "https://github.com/alphaparkinc/genpark-ray-tracer-sphere-plane-shading-skill"
Repository = "https://github.com/alphaparkinc/genpark-ray-tracer-sphere-plane-shading-skill.git"
Issues = "https://github.com/alphaparkinc/genpark-ray-tracer-sphere-plane-shading-skill/issues"
